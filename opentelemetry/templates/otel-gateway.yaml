{{- /*
Gateway : Deployment N répliques, ingest passif OTLP. On conserve le nom
externe `{{ .Values.name }}` (sans suffixe) pour ne pas casser les agents
downstream qui pointent dessus en hardcodé.
*/ -}}
{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- toYaml .Values.labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml .Values.labels | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.gateway.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-gateway
          image: {{ .Values.image }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - "--config=/etc/otelcol-contrib/config.yaml"
            {{- range .Values.featureGates }}
            - "{{ . }}"
            {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: varlog
              mountPath: /var/log/pods
              readOnly: true
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8000
      volumes:
        - name: data
          configMap:
            name: otel-gateway-configmap
        - name: varlog
          hostPath:
            path: /var/log/pods/
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
