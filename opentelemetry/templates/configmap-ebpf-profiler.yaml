{{- if .Values.ebpfProfiler.enabled }}
{{- /*
  Génère le ConfigMap eBPF PROFILER avec filtrage automatique des fragments
  en fonction de `ebpfProfiler.pipelinesFile`. Logique strictement identique
  à celle des 3 autres rôles (gateway/agent/scraper).
*/ -}}

{{- $conf := dict
  "receivers"  dict
  "processors" dict
  "exporters"  dict
  "connectors" dict
  "extensions" dict
-}}

{{- /* ebpf-profiler binaire ≠ contrib : il ne supporte qu'un subset d'extensions
       (opamp, health_check, pprof). On exclut donc `extensions` du
       fragmentDirs pour ce rôle — pas d'`extensions:` ni de
       `service.extensions` rendus. Si besoin d'en ajouter un jour, on filtrera. */ -}}
{{- $kinds := list "receivers" "processors" "exporters" "connectors" }}

  # Fusion ordonnée des fragments : pour chaque kind, parcours la liste des
  # dossiers et mergeOverwrite chacun par-dessus le résultat courant. Le
  # dernier dossier de la liste écrase les précédents en cas de conflit.
{{- range $kind := $kinds }}
  {{- $dirs := default (list) (index $.Values.fragmentDirs $kind) }}
  {{- range $rawDir := $dirs }}
    {{- $path := trimPrefix "./" $rawDir }}
    {{- if $path }}
      {{- $files := $.Files.Glob (printf "%s/*.y*ml" $path) }}
      {{- range $filePath, $fileContent := $files }}
        {{- $yaml := fromYaml (toString $fileContent) }}
        {{- if $yaml }}
          {{- $_ := set $conf $kind (mergeOverwrite (get $conf $kind) $yaml) }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

  # Pipelines eBPF PROFILER
{{- $pipelines := fromYaml (.Files.Get (trimPrefix "./" .Values.ebpfProfiler.pipelinesFile)) }}

  # Extraction des éléments réellement utilisés
{{- $usedReceivers := list }}
{{- $usedProcessors := list }}
{{- $usedExporters := list }}

{{- range $pName, $pConf := $pipelines.pipelines }}
  {{- range $r := $pConf.receivers }}
    {{- $usedReceivers = append $usedReceivers $r }}
  {{- end }}
  {{- range $pr := $pConf.processors }}
    {{- $usedProcessors = append $usedProcessors $pr }}
  {{- end }}
  {{- range $e := $pConf.exporters }}
    {{- $usedExporters = append $usedExporters $e }}
  {{- end }}
{{- end }}

  # Filtrage des fragments
{{- $filteredReceivers := dict }}
{{- range $name, $item := (get $conf "receivers") }}
  {{- if mustHas $name $usedReceivers }}
    {{- $_ := set $filteredReceivers $name $item }}
  {{- end }}
{{- end }}

{{- $filteredProcessors := dict }}
{{- range $name, $item := (get $conf "processors") }}
  {{- if mustHas $name $usedProcessors }}
    {{- $_ := set $filteredProcessors $name $item }}
  {{- end }}
{{- end }}

{{- $filteredExporters := dict }}
{{- range $name, $item := (get $conf "exporters") }}
  {{- if mustHas $name $usedExporters }}
    {{- $_ := set $filteredExporters $name $item }}
  {{- end }}
{{- end }}

{{- $filteredConnectors := dict }}
{{- range $name, $item := (get $conf "connectors") }}
  {{- if or (mustHas $name $usedReceivers) (mustHas $name $usedExporters) }}
    {{- $_ := set $filteredConnectors $name $item }}
  {{- end }}
{{- end }}

{{- $serviceBlock := dict "pipelines" $pipelines.pipelines }}

{{- $ebpfConfig := dict
  "receivers"  $filteredReceivers
  "processors" $filteredProcessors
  "exporters"  $filteredExporters
  "connectors" $filteredConnectors
  "service"    $serviceBlock
-}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-ebpf-profiler-configmap
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
{{ toYaml $ebpfConfig | indent 4 }}
{{- end }}
