name: release-charts

# Publie les charts comme artefacts OCI sur ghcr.io/rridane/charts.
# Déclenché sur un tag `v*` (release) ou à la main. Chaque chart est poussé sous
# sa version (Chart.yaml). Bumper la version d'un chart = publier une nouvelle release.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write        # requis pour pousser sur ghcr

jobs:
  oci-release:
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
      CHARTS: "cloudnative-pg filebrowser gateway-http-routes opentelemetry parca pvc-generator rancher-rbac"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package & push charts (OCI)
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg
          for chart in $CHARTS; do
            echo "::group::$chart"
            rm -f /tmp/pkg/*.tgz
            helm dependency build "$chart" 2>/dev/null || true
            helm package "$chart" --destination /tmp/pkg
            helm push /tmp/pkg/*.tgz "$OCI_REPO" 
            echo "::endgroup::"
          done

      - name: Push ArtifactHub metadata (verified publisher)
        env:
          NS: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          # nom du chart (= chemin OCI) -> repositoryID ArtifactHub
          declare -A IDS=(
            [cloudnative-pg]=7f420fcb-41ff-408d-ad2b-e212bb081f65
            [filebrowser]=3f28bbbd-a1f3-486a-ac1f-c8e799203190
            [traefik-routes]=417db788-ab6a-4ee0-a1fe-956f6f06b926
            [otel-collector-generator]=eea6790d-6ded-4402-ae21-0e8b97824b73
            [parca]=656418e4-76ee-4c1a-b9a9-3a18f6bdf491
            [pvc-generator]=34880a72-9714-425f-b687-becf239e67ae
            [rancher-rbac]=97cfa493-04b8-4ff7-97dd-89f7360468f5
          )
          for chart in "${!IDS[@]}"; do
            printf 'repositoryID: %s\nowners:\n  - name: Rida Ridane\n    email: rridane@rr-dev.com\n' "${IDS[$chart]}" > artifacthub-repo.yml
            oras push "$NS/$chart:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          done

      # NB : au 1er push, les packages ghcr sont PRIVÉS par défaut. Pour un pull
      # anonyme (ArgoCD / ArtifactHub), passe chaque package en "public" une fois
      # (Profil GitHub → Packages → <chart> → Package settings → Change visibility).
