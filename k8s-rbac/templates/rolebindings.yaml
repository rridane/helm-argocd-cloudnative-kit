{{- range $b := .Values.roleBindings }}
{{- range $g := $b.groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Nom incluant le groupe (le module TF d'origine nommait juste `oidc-<role>`,
  # ce qui collisionnait si plusieurs groupes visaient le même rôle/ns — corrigé).
  name: oidc-{{ $b.role }}-{{ $g | replace ":" "-" }}
  namespace: {{ $b.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    rbac.rridane.dev/scope: namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $b.role }}
subjects:
  - kind: Group
    name: {{ $g | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
