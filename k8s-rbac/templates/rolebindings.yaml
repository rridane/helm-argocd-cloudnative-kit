{{- range $b := .Values.roleBindings }}
{{- range $g := $b.groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Le nom inclut le groupe : évite les collisions quand plusieurs groupes
  # visent le même rôle dans le même namespace.
  name: oidc-{{ $b.role }}-{{ $g | replace ":" "-" }}
  namespace: {{ $b.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: namespace-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $b.role }}
subjects:
  - kind: Group
    name: {{ $g | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
