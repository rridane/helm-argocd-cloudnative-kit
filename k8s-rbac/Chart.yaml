apiVersion: v2
name: k8s-rbac
description: |
  RBAC k8s piloté par groupes OIDC : ClusterRoles (avec agrégation), Roles
  namespaced, et bindings qui associent des groupes OIDC (claim `groups` du
  token) à des (Cluster)Roles. Pensé pour l'accès kubectl fédéré par OIDC.
