# RBAC piloté par groupes OIDC. Les bindings référencent des NOMS de groupes
# (claim `groups` du token OIDC), pas des IDs → totalement découplé du fournisseur
# d'identité. Les champs de `rules` sont les champs k8s natifs (apiGroups,
# resources, verbs, resourceNames, nonResourceURLs).

# ClusterRoles à créer (create: false = juste référencer un rôle existant,
# ex. le built-in `cluster-admin`).
clusterRoles: {}
#   pod-restarter:
#     rules:
#       - apiGroups: [""]
#         resources: [pods]
#         verbs: [delete]
#   view-extended:
#     # Rôle agrégateur : pas de rules, il absorbe les rôles portant ces labels.
#     aggregateFromLabels:
#       - { rbac.authorization.k8s.io/aggregate-to-view: "true" }
#   cluster-admin:
#     create: false        # built-in, on ne le (re)crée pas

# Roles namespaced (optionnel).
namespacedRoles: []
#   - namespace: my-namespace
#     name: secret-reader
#     rules:
#       - apiGroups: [""]
#         resources: [secrets]
#         verbs: [get, list]

# ClusterRoleBindings : groupe(s) OIDC → ClusterRole (cluster-wide).
clusterRoleBindings: []
#   - clusterRole: cluster-admin
#     groups: ["oidc:cluster-admins"]

# RoleBindings : groupe(s) OIDC → (Cluster)Role dans un namespace.
roleBindings: []
#   - namespace: my-namespace
#     role: pod-restarter
#     groups: ["oidc:pod-restarters"]
